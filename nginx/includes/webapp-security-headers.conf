# Security headers for the production Expo web bundle served by webapp nginx.
# Stripe Checkout/Portal, Google OAuth, and Apple OAuth use top-level redirects
# through WonderTales API routes, so they do not need script/connect/frame access.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self' https://*.i.posthog.com https://*.posthog.com; script-src-elem 'self' https://*.i.posthog.com https://*.posthog.com; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; style-src-elem 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://*.i.posthog.com https://*.posthog.com; media-src 'self' blob: https:; manifest-src 'self'; frame-src 'self'; worker-src 'self' blob:; form-action 'self'; upgrade-insecure-requests" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
