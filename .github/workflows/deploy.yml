name: Deploy to DigitalOcean

on:
  push:
    branches:
      - main

jobs:
  quality_gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run launch gate
        run: pnpm launch:gate

  deploy:
    needs: quality_gate
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
      
      - name: Deploy to Droplet
        env:
          DROPLET_IP: ${{ secrets.DROPLET_IP }}
          DROPLET_USER: root
        run: |
          ssh -o StrictHostKeyChecking=no ${DROPLET_USER}@${DROPLET_IP} << 'EOF'
            cd /var/www/kazka
            git pull origin main
            docker compose -f docker-compose.prod.yml build api
            docker compose -f docker-compose.prod.yml up -d api
            echo "Running database migrations..."
            docker exec wondertales-api-prod sh -c 'cd /app/services/api && npx tsx src/scripts/runAllMigrations.ts'
            echo "Deployment completed!"
          EOF
      
      - name: Health check
        run: |
          sleep 10
          curl -f http://${{ secrets.DROPLET_IP }}/health || exit 1
