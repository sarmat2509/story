services:
  postgres:
    image: postgres:15-alpine
    container_name: wondertales-postgres-dev
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kazka}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpass}
      POSTGRES_DB: ${POSTGRES_DB:-kazka_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kazka} -d ${POSTGRES_DB:-kazka_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
      target: development
    container_name: wondertales-api-dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-kazka}:${POSTGRES_PASSWORD:-devpass}@postgres:5432/${POSTGRES_DB:-kazka_dev}
      REDIS_URL: redis://redis:6379
    env_file:
      - .env.local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Development mode: mount source code for hot reload
      - ./services/api/src:/app/services/api/src
      - ./services/api/drizzle:/app/services/api/drizzle
      - ./packages:/app/packages
      - ./services/api/uploads:/app/services/api/uploads  # Mount local uploads directory
      - ./image-prompt-debug:/app/image-prompt-debug
      - api_logs:/app/services/api/logs
      - ./secrets:/app/secrets:ro
      # Use image's node_modules (anonymous volumes above overwrote with empty dirs → bcryptjs not found)

  redis:
    image: redis:7-alpine
    container_name: wondertales-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    container_name: wondertales-nginx-dev
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d.dev:/etc/nginx/conf.d:ro
      - ./nginx/includes:/etc/nginx/includes:ro
      - ./apps/universal-app/public:/usr/share/nginx/html:ro
    depends_on:
      - api
    # Allows nginx container to reach Metro server running on the host (port 8081)
    extra_hosts:
      - "host.docker.internal:host-gateway"

  adminer:
    image: adminer:latest
    container_name: wondertales-adminer-dev
    restart: unless-stopped
    ports:
      - "8083:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  api_logs:
    driver: local
