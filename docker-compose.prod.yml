services:
  postgres:
    image: postgres:15-alpine
    container_name: wondertales-postgres-prod
    restart: always
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: wondertales-redis-prod
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: kazka-api:latest
    build:
      context: .
      dockerfile: services/api/Dockerfile
      target: production
      args:
        BUILDKIT_INLINE_CACHE: 1
    container_name: wondertales-api-prod
    restart: always
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      RUN_JOB_WORKERS: "false"
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - api_uploads:/app/services/api/uploads
      - ./image-prompt-debug:/app/image-prompt-debug
      - api_logs:/app/services/api/logs
      - ./secrets:/app/secrets:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  worker:
    image: kazka-api:latest
    container_name: wondertales-worker-prod
    restart: always
    command: ["pnpm", "start:worker"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      RUN_HTTP_SERVER: "false"
      RUN_JOB_WORKERS: "true"
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - api_uploads:/app/services/api/uploads
      - ./image-prompt-debug:/app/image-prompt-debug
      - api_logs:/app/services/api/logs
      - ./secrets:/app/secrets:ro
    stop_grace_period: 15m

  nginx:
    image: nginx:alpine
    container_name: wondertales-nginx
    restart: always
    expose:
      - "80"
      - "443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/includes:/etc/nginx/includes:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      api:
        condition: service_healthy

  webapp:
    image: nginx:alpine
    container_name: wondertales-webapp-prod
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./apps/universal-app/dist:/usr/share/nginx/html:ro
      - ./apps/universal-app/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/includes:/etc/nginx/includes:ro
    environment:
      NODE_ENV: production

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  api_uploads:
    driver: local
  api_logs:
    driver: local
