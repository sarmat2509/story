upstream api_backend {
    server api:3000;
}

upstream webapp_backend {
    server webapp:80;
}

server {
    listen 80;
    server_name wondertales.art www.wondertales.art;
    
    # ACME challenge for Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    # Redirect HTTP to HTTPS
    location / {
        return 301 https://wondertales.art$request_uri;
    }
}

# HTTPS canonical redirect for www
server {
    listen 443 ssl;
    http2 on;
    server_name www.wondertales.art;

    ssl_certificate /etc/letsencrypt/live/wondertales.art/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wondertales.art/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    return 301 https://wondertales.art$request_uri;
}

# HTTPS configuration
server {
    listen 443 ssl;
    http2 on;
    server_name wondertales.art;
    
    ssl_certificate /etc/letsencrypt/live/wondertales.art/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wondertales.art/privkey.pem;
    
    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location = /.well-known/security.txt {
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /security.txt {
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Generated/uploaded assets can be large; avoid nginx proxy temp-file warnings.
    location ^~ /api/v1/assets/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;
        proxy_max_temp_file_size 0;

        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # API endpoints
    location /api/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
    
    # Health check for API
    location /health {
        proxy_pass http://api_backend;
        access_log off;
    }

    # Sitemap
    location = /sitemap.xml {
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Stories catalog (SSR from API)
    location = /stories {
        proxy_pass http://api_backend/ssr/stories;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Legacy English public URLs now live without a locale prefix.
    location = /en {
        return 301 /;
    }

    location = /en/ {
        return 301 /;
    }

    location ~ ^/en/(pricing|stories|blog|terms|privacy|support)/?$ {
        return 301 /$1;
    }

    location ~ ^/en/blog/([^/?]+)/?$ {
        return 301 /blog/$1;
    }

    location ~ ^/en/(wizard|welcome|register)/?$ {
        return 301 /$1?locale=en;
    }

    # Landing page (SSR from API) — homepage at /
    location = / {
        proxy_pass http://api_backend/ssr/landing;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /pricing {
        proxy_pass http://api_backend/ssr/pricing;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(uk|ru|es|de|fr|pl)/pricing/?$ {
        rewrite ^/(uk|ru|es|de|fr|pl)/pricing/?$ /ssr/pricing/$1 break;
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Localized landing pages -> API SSR
    location ~ ^/(uk|ru|es|de|fr|pl)/?$ {
        rewrite ^/(uk|ru|es|de|fr|pl)/?$ /ssr/landing/$1 break;
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Share-card images (og:image 1200×630)
    location ^~ /share-card/ {
        proxy_pass http://api_backend/share-card/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
    }

    # Terms of Service and Privacy Policy (SSR from API)
    location = /terms {
        proxy_pass http://api_backend/ssr/legal/terms;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
    }

    location ~ ^/(uk|ru|es|de|fr|pl)/terms/?$ {
        rewrite ^/(uk|ru|es|de|fr|pl)/terms/?$ /ssr/legal/terms/$1 break;
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
    }

    location = /privacy {
        proxy_pass http://api_backend/ssr/legal/privacy;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
    }

    location ~ ^/(uk|ru|es|de|fr|pl)/privacy/?$ {
        rewrite ^/(uk|ru|es|de|fr|pl)/privacy/?$ /ssr/legal/privacy/$1 break;
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
    }

    # Support / contact page (SSR from API)
    location = /support {
        proxy_pass http://api_backend/ssr/support;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(uk|ru|es|de|fr|pl)/support/?$ {
        rewrite ^/(uk|ru|es|de|fr|pl)/support/?$ /ssr/support/$1 break;
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Blog index and article pages (SSR from API)
    location = /blog {
        proxy_pass http://api_backend/ssr/blog;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(uk|ru|es|de|fr|pl)/blog/?$ {
        rewrite ^/(uk|ru|es|de|fr|pl)/blog/?$ /ssr/blog/index/$1 break;
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /blog/ {
        proxy_pass http://api_backend/ssr/blog/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location ~ ^/(uk|ru|es|de|fr|pl)/blog/([^/?]+)/?$ {
        rewrite ^/(uk|ru|es|de|fr|pl)/blog/([^/?]+)/?$ /ssr/blog/$1/$2 break;
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Stories: /stories/:slug -> API SSR
    location ^~ /stories/ {
        proxy_pass http://api_backend/ssr/stories/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location ~ ^/(uk|ru|es|de|fr|pl)/stories/?$ {
        rewrite ^/(uk|ru|es|de|fr|pl)/stories/?$ /ssr/stories/catalog/$1 break;
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Public author pages: /authors/:authorId -> API SSR
    location ^~ /authors/ {
        proxy_pass http://api_backend/ssr/authors/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Unlisted stories: /u/:token -> API SSR
    location ^~ /u/ {
        add_header X-Robots-Tag "noindex,nofollow" always;
        proxy_pass http://api_backend/ssr/u/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Authenticated billing routes are SPA-only and must not be indexed.
    location ^~ /billing/ {
        include /etc/nginx/includes/spa-noindex.conf;
        include /etc/nginx/includes/spa-proxy-prod.conf;
    }

    # App-only routes stay on the SPA, but must never be indexable.
    location ~ ^/(?:(?:uk|ru|en|es|de|fr|pl)/)?(?:mode-selection|child-mode|welcome|register|dashboard|wizard|children(?:/[^/]+)?|ChildDetail|characters|profile|library|404)/?$ {
        include /etc/nginx/includes/spa-noindex.conf;
        include /etc/nginx/includes/spa-proxy-prod.conf;
    }

    location ~ ^/(?:(?:uk|ru|en|es|de|fr|pl)/)?(?:auth|me|settings|admin|billing|authors|story|u)(?:/|$) {
        include /etc/nginx/includes/spa-noindex.conf;
        include /etc/nginx/includes/spa-proxy-prod.conf;
    }

    location ~ ^/(?:uk|ru|es|de|fr|pl)/stories(?:/|$) {
        include /etc/nginx/includes/spa-noindex.conf;
        include /etc/nginx/includes/spa-proxy-prod.conf;
    }

    location = /favicon.ico {
        return 302 /favicon.png?v=20260701-logo-v2;
    }

    # Web app static assets
    location ^~ /landing/ {
        include /etc/nginx/includes/spa-proxy-prod.conf;
    }

    location ~* ^/(?:_expo|static|assets)(?:/|$) {
        include /etc/nginx/includes/spa-proxy-prod.conf;
    }

    location ~* ^/(?:favicon\.ico|robots\.txt|manifest\.json|[^/]+\.(?:js|css|map|png|jpg|jpeg|gif|ico|svg|webp|woff2?|ttf|eot|json))$ {
        include /etc/nginx/includes/spa-proxy-prod.conf;
    }

    # Unknown public routes should not become soft-404 SPA pages.
    location / {
        add_header X-Robots-Tag "noindex,nofollow" always;
        return 404;
    }
}
