upstream api_backend {
    server api:3000;
}

# Metro dev server (Expo web) running on the host machine
# Matches "web:metro" script: expo start --web --port 8082
upstream metro_backend {
    server host.docker.internal:8082;
}

# Metro HMR/WebSocket can sit idle; nginx default read timeout (~60s) drops upgraded connections.
map $http_upgrade $metro_connection {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name localhost;

    # API endpoints
    location /api/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Longer timeouts for development/debugging
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # CORS headers for development
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept' always;
        add_header 'Access-Control-Max-Age' 1728000;

        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }

    # Health check for API
    location /health {
        proxy_pass http://api_backend;
        access_log off;
    }

    # Sitemap
    location = /sitemap.xml {
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Stories: exact /stories → SPA catalog (Metro); /stories/:slug → API SSR
    location = /stories {
        proxy_pass http://metro_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $metro_connection;
        # Use $http_host (preserves port from browser) so Metro generates correct source map URLs
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 300s;
        proxy_send_timeout 86400s;
        proxy_read_timeout 86400s;
    }

    # Landing page (SSR from API) — homepage at /
    location = / {
        proxy_pass http://api_backend/ssr/landing;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /pricing {
        proxy_pass http://api_backend/ssr/pricing;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(uk|ru|en|es|de|fr|pl)/pricing/?$ {
        rewrite ^/(uk|ru|en|es|de|fr|pl)/pricing/?$ /ssr/pricing/$1 break;
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Localized landing pages: /en and /en/ -> API SSR
    location ~ ^/(uk|ru|en|es|de|fr|pl)/?$ {
        rewrite ^/(uk|ru|en|es|de|fr|pl)/?$ /ssr/landing/$1 break;
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Share-card images (og:image 1200×630)
    location ^~ /share-card/ {
        proxy_pass http://api_backend/share-card/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Terms of Service and Privacy Policy (SSR from API)
    location = /terms {
        proxy_pass http://api_backend/ssr/legal/terms;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
    }

    location = /privacy {
        proxy_pass http://api_backend/ssr/legal/privacy;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
    }

    # Stories: /stories/:slug -> API SSR
    location ^~ /stories/ {
        proxy_pass http://api_backend/ssr/stories/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Unlisted stories: /u/:token -> API SSR
    location ^~ /u/ {
        proxy_pass http://api_backend/ssr/u/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Authenticated billing routes are SPA-only and must not be indexed.
    location ^~ /billing/ {
        add_header X-Robots-Tag "noindex,nofollow" always;
        proxy_pass http://metro_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $metro_connection;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 300s;
        proxy_send_timeout 86400s;
        proxy_read_timeout 86400s;
    }

    # Metro static assets (Expo web bundle, HMR websocket)
    location ~* ^/(_expo|static|assets)/ {
        proxy_pass http://metro_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $metro_connection;
        # Use $http_host so Metro generates source map / HMR URLs with the correct external port
        proxy_set_header Host $http_host;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 300s;
        proxy_send_timeout 86400s;
        proxy_read_timeout 86400s;
    }

    # Everything else → Metro (React Native Web / SPA), including /hot (HMR)
    location / {
        proxy_pass http://metro_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $metro_connection;
        # Use $http_host so Metro generates source map / HMR URLs with the correct external port
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 300s;
        proxy_send_timeout 86400s;
        proxy_read_timeout 86400s;
    }
}
