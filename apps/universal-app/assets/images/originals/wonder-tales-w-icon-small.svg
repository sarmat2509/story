<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">WonderTales small app icon</title>
  <desc id="desc">A small-size optimized WonderTales icon with a bright gradient background and a simplified thick book-shaped W mark.</desc>
  <defs>
