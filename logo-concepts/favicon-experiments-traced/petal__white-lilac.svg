<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Wonder Tales traced favicon experiment petal white-lilac</title>
  <desc id="desc">A thicker Wonder Tales favicon experiment with petal background and white lilac symbol.</desc>
  <defs>
    <linearGradient id="background" x1="178" y1="88" x2="846" y2="944" gradientUnits="userSpaceOnUse">
