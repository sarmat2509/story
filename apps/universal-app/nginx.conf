server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss;

    # Security headers
    include /etc/nginx/includes/webapp-security-headers.conf;

    # The Expo web bundle has a stable filename. Always revalidate it so a new
    # deploy cannot hydrate SSR HTML with stale client code.
    location = /static/js/bundle.js {
        expires -1;
        include /etc/nginx/includes/webapp-security-headers.conf;
        add_header Cache-Control "public, no-cache, must-revalidate";
        try_files $uri =404;
    }

    # Open tabs poll this file and reload themselves when a new web build is
    # deployed. It must always reach the origin instead of an edge cache.
    location = /build-version.json {
        expires -1;
        include /etc/nginx/includes/webapp-security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # Legacy/browser-discovered icon URLs may not include the build version.
    location ~* ^/(?:favicon\.png|apple-touch-icon\.png|icon-192\.png|icon-512\.png|og-landing\.png)$ {
        expires 10m;
        include /etc/nginx/includes/webapp-security-headers.conf;
        add_header Cache-Control "public, max-age=600, must-revalidate";
        try_files $uri =404;
    }

    # Landing/blog artwork uses stable human-readable filenames and can be
    # replaced by a deploy, so do not give it the immutable asset policy.
    location ^~ /landing/ {
        expires 10m;
        include /etc/nginx/includes/webapp-security-headers.conf;
        add_header Cache-Control "public, max-age=600, must-revalidate";
        try_files $uri =404;
    }

    # Cache fingerprinted static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        include /etc/nginx/includes/webapp-security-headers.conf;
        add_header Cache-Control "public, immutable";
    }

    # SPA routing - redirect all to index.html
    # index.html must not be cached so browser always gets latest asset references
    location = /index.html {
        include /etc/nginx/includes/webapp-security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check
    location /health {
        access_log off;
        return 200 "OK";
        include /etc/nginx/includes/webapp-security-headers.conf;
        add_header Content-Type text/plain;
    }
}
