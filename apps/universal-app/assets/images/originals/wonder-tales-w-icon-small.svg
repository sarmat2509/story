      <stop offset="1" stop-color="#E15F4E"/>
    </linearGradient>
    <radialGradient id="backgroundGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(282 238) rotate(38) scale(560 408)">
      <stop stop-color="#FFF7E8" stop-opacity="0.44"/>
      <stop offset="0.58" stop-color="#FFE3D2" stop-opacity="0.18"/>
